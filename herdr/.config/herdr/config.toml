onboarding = false
# herdr configuration — Stow-owned (real file in ~/dotfiles/herdr).
# Agent multiplexer that replaces tmux. Managed like the rest of the dotfiles.
# Validate after edits:  herdr config check
# Apply to a running server:  herdr server reload-config   (or prefix+shift+r)

[theme]
# Near-black to match Ghostty's black background; agent colors still pop.
name = "vesper"

[keys]
# Caps Lock is remapped to F18 via a hidutil login agent (see ~/dotfiles/keymap),
# so the physical Caps Lock key IS the herdr prefix. Tap Caps, then a key.
#   Caps v      -> split vertical
#   Caps -      -> split horizontal
#   Caps h/j/k/l-> focus pane
#   Caps c      -> new tab      Caps n/p -> next/prev tab   Caps 1..9 -> switch tab
#   Caps z      -> zoom pane    Caps x -> close pane        Caps b -> toggle sidebar
#   Caps w      -> workspace picker    Caps q -> detach
#   Caps ?      -> help         Caps shift+r -> reload config
prefix = "f18"

# lazygit in a floating popup: Caps g
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

# ── herdr-splits: seamless Ctrl-hjkl nav / Alt-hjkl resize across herdr <-> nvim ──
# Requires: herdr plugin install lmilojevicc/herdr-splits.nvim --yes
# and the matching herdr-splits.nvim spec in nvim (loads when HERDR_ENV=1).
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "herdr-splits.nav-left"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "herdr-splits.nav-down"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "herdr-splits.nav-up"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "herdr-splits.nav-right"

[[keys.command]]
key = "alt+h"
type = "plugin_action"
command = "herdr-splits.resize-left"

[[keys.command]]
key = "alt+j"
type = "plugin_action"
command = "herdr-splits.resize-down"

[[keys.command]]
key = "alt+k"
type = "plugin_action"
command = "herdr-splits.resize-up"

[[keys.command]]
key = "alt+l"
type = "plugin_action"
command = "herdr-splits.resize-right"

[ui]
agent_panel_sort = "priority"
