# Publishes packages/herdr-bobshell to npm when a herdr-bobshell-v<version>
# tag is pushed (packages/herdr-bobshell/scripts/release.sh does that).
#
# Auth is npm trusted publishing: npmjs.com trusts this workflow file in this
# repo, and the job exchanges its GitHub OIDC token for a short-lived publish
# credential. There is no NPM_TOKEN secret. npm attaches a provenance statement
# automatically (public package, public repo).
#
# The same version also goes to GitHub Packages, which is what lists the
# package on the repo page; that publish uses the workflow's GITHUB_TOKEN.
name: Publish herdr-bobshell

on:
  push:
    tags:
      - "herdr-bobshell-v*"

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing
  packages: write # GitHub Packages

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/herdr-bobshell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1+.
      - run: npm install -g npm@latest

      - name: Tag matches package version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "${GITHUB_REF_NAME}" != "herdr-bobshell-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm test

      - run: npm publish

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          printf '%s\n' '@zack-maz:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$RUNNER_TEMP/ghp.npmrc"
          npm publish --userconfig "$RUNNER_TEMP/ghp.npmrc" --registry https://npm.pkg.github.com

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "herdr-bobshell ${version}" \
            --notes "Published to npm as \`${name}@${version}\`.

          \`\`\`sh
          npm install -g ${name}@${version}
          herdr-bobshell install
          \`\`\`"
