# Remap prefix from Ctrl-b to Ctrl-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Split panes with | and -
bind | split-window -h
bind - split-window -v

# Mouse support (click panes, scroll, resize)
set -g mouse on

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- FLIR Thermal Theme ---

# Pane borders
set -g pane-border-style "fg=#1e0f50"
set -g pane-active-border-style "fg=#dc6432"

# Status bar
set -g status-style "bg=#0d0d0d,fg=#dc6432"
set -g status-left "#[bg=#dc6432,fg=#0d0d0d,bold] #S #[bg=#0d0d0d] "
set -g status-right "#[fg=#b43278]%H:%M #[fg=#5a2d80]│ #[fg=#dc6432]%b %d "
set -g status-left-length 20
set -g status-right-length 40

# Window tabs
set -g window-status-format "#[fg=#5a2d80] #I:#W "
set -g window-status-current-format "#[bg=#1a0a30,fg=#f0a014,bold] #I:#W "
set -g window-status-separator ""

# Messages and command line
set -g message-style "bg=#1a0a30,fg=#f0a014"
set -g message-command-style "bg=#1a0a30,fg=#dc6432"

# Clock
set -g clock-mode-colour "#dc6432"
