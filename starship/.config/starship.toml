"$schema" = 'https://starship.rs/config-schema.json'

# Black prompt, vibrant text — matches the black Ghostty background.
# Stow-owned: real file in ~/dotfiles/starship. Needs a Nerd Font (Ghostty uses
# JetBrainsMono Nerd Font, so the glyphs below render).

format = """
[](surface0)\
$os\
$directory\
[](fg:surface0 bg:surface1)\
$git_branch\
$git_status\
[](fg:surface1 bg:surface2)\
$python\
$nodejs\
$rust\
$golang\
$package\
[](fg:surface2)\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

palette = "tokyonight_storm"

[fill]
symbol = " "

# ── left island: OS + directory ──────────────────────────────────────────────
[os]
disabled = false
style = "bg:surface0 fg:text"
[os.symbols]
Macos = "󰀵 "

[directory]
style = "fg:sky bg:surface0"
format = "[ $path ]($style)"
# Inside a git repo the path is colored in three tiers so the repo name pops:
# dim gray ancestors → mauve repo root (matches the branch island) → blue subpath.
before_repo_root_style = "fg:overlay0 bg:surface0"
repo_root_style = "bold fg:mauve bg:surface0"
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "fg:red bg:surface0"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Projects" = "󰲋 "
".config" = " "

# ── git island ───────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bg:surface1 fg:mauve"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:surface1 fg:red"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = " ${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ── language / runtime island ────────────────────────────────────────────────
[python]
symbol = " "
style = "bg:surface2 fg:yellow"
# Shows the active virtualenv name in (parens) plus the interpreter version.
format = '[ $symbol($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "bg:surface2 fg:green"
format = "[ $symbol($version) ]($style)"

[rust]
symbol = " "
style = "bg:surface2 fg:peach"
format = "[ $symbol($version) ]($style)"

[golang]
symbol = " "
style = "bg:surface2 fg:sky"
format = "[ $symbol($version) ]($style)"

[package]
symbol = "󰏗 "
style = "bg:surface2 fg:teal"
format = "[ $symbol$version ]($style)"

# ── right side: duration + clock ─────────────────────────────────────────────
[cmd_duration]
min_time = 500
style = "fg:overlay1"
format = "[ 󱎫 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay1"
format = "[ 󰥔 $time ]($style)"

# ── prompt character ─────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](mauve)"

# ── Black prompt, vibrant text ───────────────────────────────────────────────
# Island backgrounds are near-black grays (so the prompt reads BLACK, not purple);
# the text colors stay vivid TokyoNight so branch/venv/versions pop.
[palettes.tokyonight_storm]
text     = "#c8d3f5"
mauve    = "#bb9af7"   # purple (git branch)
red      = "#f7768e"   # git status
peach    = "#ff9e64"   # orange (rust)
yellow   = "#e0af68"   # node
green    = "#9ece6a"   # python
teal     = "#73daca"   # go / package
sky      = "#7aa2f7"   # blue (golang label)
overlay1 = "#7a88b8"   # duration + clock (brighter on black)
overlay0 = "#414868"   # autosuggest / dim
surface0 = "#141414"   # island 1 (dir)   — near-black
surface1 = "#1c1c1c"   # island 2 (git)
surface2 = "#242424"   # island 3 (langs)
base     = "#0a0a0a"   # true background
