"$schema" = 'https://starship.rs/config-schema.json'

# Vesper prompt (near-black + warm accents) — matches Ghostty + herdr + LazyVim.
# Stow-owned: real file in ~/dotfiles/starship. Needs a Nerd Font (Ghostty uses
# JetBrainsMono Nerd Font, so the glyphs below render).

format = """
[](surface0)\
$os\
$directory\
[](fg:surface0 bg:surface1)\
$git_branch\
$git_status\
[](fg:surface1 bg:surface2)\
$python\
$nodejs\
$rust\
$golang\
$package\
[](fg:surface2)\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

palette = "vesper"

[fill]
symbol = " "

# ── left island: OS + directory ──────────────────────────────────────────────
[os]
disabled = false
style = "bg:surface0 fg:text"
[os.symbols]
Macos = "󰀵 "

[directory]
style = "fg:text bg:surface0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Projects" = "󰲋 "
".config" = " "

# ── git island ───────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bg:surface1 fg:mauve"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:surface1 fg:red"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = " ${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ── language / runtime island ────────────────────────────────────────────────
[python]
symbol = " "
style = "bg:surface2 fg:yellow"
# Shows the active virtualenv name in (parens) plus the interpreter version.
format = '[ $symbol($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "bg:surface2 fg:green"
format = "[ $symbol($version) ]($style)"

[rust]
symbol = " "
style = "bg:surface2 fg:peach"
format = "[ $symbol($version) ]($style)"

[golang]
symbol = " "
style = "bg:surface2 fg:sky"
format = "[ $symbol($version) ]($style)"

[package]
symbol = "󰏗 "
style = "bg:surface2 fg:teal"
format = "[ $symbol$version ]($style)"

# ── right side: duration + clock ─────────────────────────────────────────────
[cmd_duration]
min_time = 500
style = "fg:overlay1"
format = "[ 󱎫 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay1"
format = "[ 󰥔 $time ]($style)"

# ── prompt character ─────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](mauve)"

# ── Vesper palette (black background, warm minimal accents) ──────────────────
# Islands step up from near-black; accents pulled from Ghostty's Vesper theme.
[palettes.vesper]
text     = "#ffffff"
mauve    = "#ffc799"   # amber — Vesper's signature accent (git branch)
red      = "#ff8080"   # git status
peach    = "#ffc799"   # rust
yellow   = "#e6b99d"   # node
green    = "#99ffe4"   # mint (python)
teal     = "#90b99f"   # go / package
sky      = "#a0a0a0"   # golang label
overlay1 = "#7e7e7e"   # duration + clock
overlay0 = "#4a4a4a"   # autosuggest / dim
surface0 = "#1c1c1c"   # island 1 (dir)
surface1 = "#262626"   # island 2 (git)
surface2 = "#303030"   # island 3 (langs)
base     = "#101010"   # true background
