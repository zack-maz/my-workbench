"$schema" = 'https://starship.rs/config-schema.json'

# Catppuccin Macchiato prompt — matches Ghostty + herdr + LazyVim.
# Stow-owned: real file in ~/dotfiles/starship. Needs a Nerd Font (Ghostty uses
# JetBrainsMono Nerd Font, so the glyphs below render).

format = """
[](surface0)\
$os\
$directory\
[](fg:surface0 bg:surface1)\
$git_branch\
$git_status\
[](fg:surface1 bg:surface2)\
$python\
$nodejs\
$rust\
$golang\
$package\
[](fg:surface2)\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

palette = "catppuccin_macchiato"

[fill]
symbol = " "

# ── left island: OS + directory ──────────────────────────────────────────────
[os]
disabled = false
style = "bg:surface0 fg:text"
[os.symbols]
Macos = "󰀵 "

[directory]
style = "fg:text bg:surface0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Projects" = "󰲋 "
".config" = " "

# ── git island ───────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bg:surface1 fg:mauve"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "bg:surface1 fg:red"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = " ${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# ── language / runtime island ────────────────────────────────────────────────
[python]
symbol = " "
style = "bg:surface2 fg:yellow"
# Shows the active virtualenv name in (parens) plus the interpreter version.
format = '[ $symbol($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
style = "bg:surface2 fg:green"
format = "[ $symbol($version) ]($style)"

[rust]
symbol = " "
style = "bg:surface2 fg:peach"
format = "[ $symbol($version) ]($style)"

[golang]
symbol = " "
style = "bg:surface2 fg:sky"
format = "[ $symbol($version) ]($style)"

[package]
symbol = "󰏗 "
style = "bg:surface2 fg:teal"
format = "[ $symbol$version ]($style)"

# ── right side: duration + clock ─────────────────────────────────────────────
[cmd_duration]
min_time = 500
style = "fg:overlay1"
format = "[ 󱎫 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:overlay1"
format = "[ 󰥔 $time ]($style)"

# ── prompt character ─────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](mauve)"

# ── Catppuccin Macchiato palette ─────────────────────────────────────────────
[palettes.catppuccin_macchiato]
rosewater = "#f4dbd6"
flamingo = "#f0c6c6"
pink = "#f5bde6"
mauve = "#c6a0f6"
red = "#ed8796"
maroon = "#ee99a0"
peach = "#f5a97f"
yellow = "#eed49f"
green = "#a6da95"
teal = "#8bd5ca"
sky = "#91d7e3"
sapphire = "#7dc4e4"
blue = "#8aadf4"
lavender = "#b7bdf8"
text = "#cad3f5"
subtext1 = "#b8c0e0"
subtext0 = "#a5adcb"
overlay2 = "#939ab7"
overlay1 = "#8087a2"
overlay0 = "#6e738d"
surface2 = "#5b6078"
surface1 = "#494d64"
surface0 = "#363a4f"
base = "#24273a"
mantle = "#1e2030"
crust = "#181926"
